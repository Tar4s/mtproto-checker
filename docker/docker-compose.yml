services:
  app:
    container_name: mtproto-checker
    # Built locally on the server from the repo source. compose lives in
    # <repo>/docker, so the build context is the parent (repo root) where the
    # Dockerfile is.
    build:
      context: ..
      dockerfile: Dockerfile
    image: mtproto-checker:local
    restart: unless-stopped
    environment:
      - TG_API_ID=${TG_API_ID}
      - TG_API_HASH=${TG_API_HASH}
      - CHECK_AUTH_USER=${CHECK_AUTH_USER}
      - CHECK_AUTH_PASSWORD=${CHECK_AUTH_PASSWORD}
      - PORT=${PORT:-8080}
    expose:
      - "8080"
    # Override the baked-in pool sources without rebuilding the image:
    volumes:
      - ./sources.txt:/app/sources.txt:ro

  nginx:
    container_name: mtproto-checker-nginx
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl/privkey.key:/etc/nginx/ssl/privkey.key:ro
      - ./ssl/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
    depends_on:
      - app
